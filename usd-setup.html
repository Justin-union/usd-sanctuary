<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>USD Setup Wizard — Union</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --u-100:#F4F8FF; --u-200:#DDEAFF; --u-300:#88B3FB; --u-400:#468BFF;
    --u-500:#126BF9; --u-600:#014EBF; --u-700:#033480; --u-800:#061530;
    --n-0:#FFFFFF; --n-100:#F8F8FA; --n-200:#E9EDF4; --n-250:#E2E8F1;
    --n-300:#CBD3DF; --n-400:#A3ADBD; --n-500:#848EA0; --n-600:#5C687B;
    --n-700:#2D3A4E; --n-800:#0D182C;
    --green:#4FD35E; --gold:#E99903; --red:#ED3533; --cyan:#02B3CF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--n-800);
    background: var(--n-100);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: var(--u-500); text-decoration: none; }
  a:hover { color: var(--u-600); text-decoration: underline; }
  code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em; }

  /* ---------- Top bar ---------- */
  .topbar {
    background: var(--u-800);
    color: var(--n-0);
    border-bottom: 3px solid var(--u-500);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .logo {
    font-weight: 700;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-mark {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--u-500);
    display: grid; place-items: center;
    font-size: 15px; color: white; font-weight: 700;
  }
  .topnav { display: flex; gap: 20px; font-size: 14px; }
  .topnav a { color: rgba(255,255,255,0.7); font-weight: 500; }
  .topnav a.active { color: white; }
  .topnav a:hover { color: white; text-decoration: none; }

  /* ---------- Property setup strip ---------- */
  .property-strip {
    background: var(--n-0);
    border-bottom: 1px solid var(--n-200);
    padding: 16px 28px;
    position: sticky;
    top: 56px;
    z-index: 40;
    box-shadow: 0 1px 3px rgba(13,24,44,0.04);
  }
  .property-strip-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.5fr 0.8fr 0.8fr 1fr auto;
    gap: 14px;
    align-items: end;
  }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label {
    font-size: 11px;
    color: var(--n-500);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .field input, .field select {
    padding: 8px 12px;
    border: 1px solid var(--n-300);
    border-radius: 7px;
    font-family: inherit;
    font-size: 14px;
    color: var(--n-800);
    background: var(--n-0);
    min-width: 0;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--u-500);
    box-shadow: 0 0 0 3px rgba(18,107,249,0.12);
  }
  .save-indicator {
    font-size: 12px;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 5px;
    height: 36px;
    padding: 0 4px;
  }
  .save-indicator.saving { color: var(--n-500); }

  /* ---------- Wizard layout ---------- */
  .wizard {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 28px 48px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 32px;
  }

  /* ---------- Stepper ---------- */
  .stepper {
    position: sticky;
    top: 168px;
    align-self: start;
    max-height: calc(100vh - 188px);
    overflow-y: auto;
  }
  .stepper-group { margin-bottom: 12px; }
  .stepper-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--n-500);
    font-weight: 700;
    padding: 8px 12px;
    margin-top: 8px;
  }
  .step-link {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 12px;
    align-items: center;
    padding: 9px 12px;
    margin: 2px 0;
    border-radius: 8px;
    cursor: pointer;
    color: var(--n-700);
    font-size: 13.5px;
    font-weight: 500;
    border-left: 3px solid transparent;
    transition: all 0.12s;
  }
  .step-link:hover { background: var(--u-100); color: var(--n-800); }
  .step-link.current {
    background: var(--u-100);
    border-left-color: var(--u-500);
    color: var(--u-700);
    font-weight: 600;
  }
  .step-dot {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--n-0);
    border: 1.5px solid var(--n-300);
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--n-600);
    flex-shrink: 0;
  }
  .step-link.current .step-dot {
    background: var(--u-500);
    border-color: var(--u-500);
    color: white;
  }
  .step-link.done .step-dot {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }
  .step-link.done .step-dot::after {
    content: "✓"; font-size: 13px; font-weight: 700;
  }
  .step-link.done .step-dot .num { display: none; }
  .step-link.done { color: var(--n-600); }

  /* ---------- Main canvas ---------- */
  .canvas {
    background: var(--n-0);
    border: 1px solid var(--n-200);
    border-radius: 16px;
    padding: 40px 48px;
    box-shadow: 0 4px 24px rgba(13,24,44,0.05);
    min-height: 560px;
    display: flex;
    flex-direction: column;
  }
  .step-header {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    margin-bottom: 28px;
  }
  .step-icon {
    width: 60px; height: 60px;
    border-radius: 14px;
    background: var(--u-100);
    color: var(--u-500);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .step-icon svg { width: 32px; height: 32px; }
  .step-h h1 {
    margin: 0 0 4px;
    font-size: 26px;
    font-weight: 700;
    color: var(--n-800);
    letter-spacing: -0.01em;
  }
  .step-h .sub {
    color: var(--n-600);
    font-size: 15px;
    max-width: 540px;
  }
  .step-h .crumb {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--u-500);
    font-weight: 700;
    margin-bottom: 4px;
  }

  .step-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------- Reusable bits ---------- */
  .action-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--n-300);
    background: var(--n-0);
    color: var(--n-700);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.12s;
  }
  .btn:hover { background: var(--n-100); border-color: var(--n-400); text-decoration: none; }
  .btn.primary {
    background: var(--u-500);
    color: white;
    border-color: var(--u-500);
  }
  .btn.primary:hover { background: var(--u-600); border-color: var(--u-600); }
  .btn.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--u-500);
  }
  .btn.ghost:hover { background: var(--u-100); border-color: transparent; }
  .btn svg { width: 14px; height: 14px; }

  .why-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    font-size: 13px;
    color: var(--u-500);
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px 0;
    font-family: inherit;
    font-weight: 500;
  }
  .why-toggle:hover { color: var(--u-600); }
  .why-content {
    background: var(--u-100);
    border-left: 3px solid var(--u-400);
    border-radius: 0 8px 8px 0;
    padding: 14px 18px;
    font-size: 13.5px;
    color: var(--n-700);
    line-height: 1.55;
    display: none;
  }
  .why-content.open { display: block; }

  .field-card {
    background: var(--n-100);
    border: 1px solid var(--n-200);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .field-card h4 {
    margin: 0 0 12px;
    font-size: 13px;
    color: var(--n-600);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
  }
  .smart-field {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 14px;
    align-items: center;
    padding: 10px 0;
    border-top: 1px solid var(--n-250);
  }
  .smart-field:first-of-type { border-top: none; padding-top: 0; }
  .smart-field .lbl {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--n-700);
  }
  .smart-field .val {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .smart-field input {
    flex: 1;
    padding: 7px 11px;
    border: 1px solid var(--n-300);
    border-radius: 7px;
    font-family: inherit;
    font-size: 14px;
    color: var(--n-800);
    background: var(--n-0);
  }
  .smart-field input:focus {
    outline: none; border-color: var(--u-500);
    box-shadow: 0 0 0 3px rgba(18,107,249,0.12);
  }
  .smart-field .hint {
    font-size: 11.5px;
    color: var(--n-500);
    background: var(--n-200);
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 500;
    white-space: nowrap;
  }
  .smart-field .hint.auto { background: var(--u-100); color: var(--u-600); }
  .smart-field .cite {
    font-size: 11.5px;
    color: var(--n-500);
    font-family: 'JetBrains Mono', monospace;
  }

  .micro-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .micro-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    background: var(--n-100);
    border: 1px solid var(--n-200);
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .micro-list li:hover { background: var(--u-100); border-color: var(--u-200); }
  .micro-list li.done { background: #E9F8EC; border-color: #C5EBCB; }
  .micro-list li.done .micro-title { color: var(--n-600); text-decoration: line-through; }
  .micro-check {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--n-300);
    background: var(--n-0);
    flex-shrink: 0;
    margin-top: 1px;
    display: grid;
    place-items: center;
  }
  .micro-list li.done .micro-check {
    background: var(--green);
    border-color: var(--green);
  }
  .micro-list li.done .micro-check::after {
    content: "✓"; color: white; font-size: 13px; font-weight: 700;
  }
  .micro-content { flex: 1; }
  .micro-title { font-weight: 500; color: var(--n-800); }
  .micro-sub { font-size: 12.5px; color: var(--n-600); margin-top: 2px; }

  /* ---------- Rich task rows (with captured data) ---------- */
  .task-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .task-row {
    background: var(--n-100);
    border: 1px solid var(--n-200);
    border-radius: 10px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 12px;
    transition: background 0.12s, border-color 0.12s;
  }
  .task-row:hover { border-color: var(--u-300); }
  .task-row.done {
    background: linear-gradient(180deg, #F2FCF4 0%, #FFFFFF 100%);
    border-color: #C5EBCB;
  }
  .task-row.done .task-title { color: var(--n-600); }
  .task-check {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 1.5px solid var(--n-300);
    background: var(--n-0);
    cursor: pointer;
    margin-top: 2px;
    display: grid; place-items: center;
    flex-shrink: 0;
    transition: all 0.12s;
  }
  .task-check:hover { border-color: var(--u-500); }
  .task-row.done .task-check {
    background: var(--green);
    border-color: var(--green);
  }
  .task-row.done .task-check::after {
    content: "✓"; color: white; font-size: 13px; font-weight: 700;
  }
  .task-body { min-width: 0; }
  .task-title {
    font-weight: 600;
    color: var(--n-800);
    font-size: 14px;
    line-height: 1.4;
    cursor: pointer;
  }
  .task-sub {
    font-size: 12.5px;
    color: var(--n-600);
    margin-top: 2px;
  }
  .task-inputs {
    margin-top: 10px;
    display: grid;
    gap: 10px;
  }
  .task-inputs.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .task-inputs.cols-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 720px) { .task-inputs.cols-2, .task-inputs.cols-3 { grid-template-columns: 1fr; } }
  .task-input-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .task-input-field.span-2 { grid-column: span 2; }
  .task-input-field.span-3 { grid-column: 1 / -1; }
  .task-input-field > label {
    font-size: 10.5px;
    color: var(--n-500);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .task-input-field input[type=text],
  .task-input-field input[type=email],
  .task-input-field input[type=number],
  .task-input-field input[type=date],
  .task-input-field input[type=tel],
  .task-input-field select,
  .task-input-field textarea {
    padding: 8px 11px;
    border: 1px solid var(--n-300);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--n-800);
    background: var(--n-0);
    width: 100%;
    min-width: 0;
  }
  .task-input-field input:focus,
  .task-input-field select:focus,
  .task-input-field textarea:focus {
    outline: none;
    border-color: var(--u-500);
    box-shadow: 0 0 0 3px rgba(18,107,249,0.12);
  }
  .task-input-field textarea { resize: vertical; min-height: 40px; line-height: 1.45; }
  .toggle-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-radius: 8px;
    background: var(--n-0);
    border: 1px solid var(--n-300);
    cursor: pointer;
    font-size: 13.5px;
    color: var(--n-700);
    user-select: none;
    transition: all 0.12s;
  }
  .toggle-pill:hover { border-color: var(--u-400); }
  .toggle-pill input { display: none; }
  .toggle-pill .toggle-box {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: 1.5px solid var(--n-300);
    background: var(--n-0);
    display: grid; place-items: center;
    flex-shrink: 0;
    transition: all 0.12s;
  }
  .toggle-pill input:checked + .toggle-box {
    background: var(--u-500);
    border-color: var(--u-500);
  }
  .toggle-pill input:checked + .toggle-box::after {
    content: "✓"; color: white; font-size: 11px; font-weight: 700;
  }
  .toggle-pill input:checked ~ .toggle-label {
    color: var(--u-600);
    font-weight: 600;
  }
  .field-hint {
    font-size: 11px;
    color: var(--n-500);
    margin-top: 2px;
  }
  .field-hint.warn { color: var(--gold); }
  .field-hint.brand { color: var(--u-600); }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    background: var(--u-100); color: var(--u-600);
  }
  .badge.warn { background: #FFF7E8; color: #8B5B00; }
  .badge.ok { background: #E9F8EC; color: #1F8E32; }

  /* ---------- Step footer (nav) ---------- */
  .step-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--n-200);
  }
  .step-counter {
    font-size: 13px;
    color: var(--n-500);
    font-weight: 500;
  }
  .step-counter .of { color: var(--n-400); }

  /* ---------- Progress bar at top ---------- */
  .progress-bar {
    height: 3px;
    background: var(--n-200);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--u-400), var(--u-500));
    transition: width 0.4s ease;
    width: 0%;
  }

  /* ---------- Step-specific visuals ---------- */
  .ledger-diagram {
    background: linear-gradient(180deg, var(--n-100) 0%, var(--n-0) 100%);
    border: 1px solid var(--n-200);
    border-radius: 14px;
    padding: 24px;
  }
  .ledger-diagram svg { width: 100%; height: auto; max-height: 280px; }

  .role-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .role-card {
    background: var(--n-100);
    border: 1px solid var(--n-200);
    border-radius: 12px;
    padding: 18px;
    transition: all 0.12s;
  }
  .role-card:hover { border-color: var(--u-300); background: var(--u-100); }
  .role-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--u-200);
    color: var(--u-600);
    display: grid; place-items: center;
    margin-bottom: 10px;
  }
  .role-icon svg { width: 20px; height: 20px; }
  .role-name {
    font-weight: 600;
    color: var(--n-800);
    font-size: 14.5px;
    margin-bottom: 4px;
  }
  .role-desc {
    font-size: 12.5px;
    color: var(--n-600);
    margin-bottom: 10px;
  }
  .role-input {
    width: 100%;
    padding: 7px 10px;
    font-size: 13px;
    border: 1px solid var(--n-300);
    border-radius: 6px;
    font-family: inherit;
    background: var(--n-0);
  }
  .role-input:focus { outline: none; border-color: var(--u-500); box-shadow: 0 0 0 3px rgba(18,107,249,0.12); }

  /* ---------- Final step ---------- */
  .launch-status {
    background: linear-gradient(135deg, var(--u-100) 0%, #ECF3FF 100%);
    border: 1px solid var(--u-200);
    border-radius: 16px;
    padding: 32px;
    text-align: center;
  }
  .launch-status.complete {
    background: linear-gradient(135deg, #E9F8EC 0%, #DCFEE2 100%);
    border-color: #9BE0A6;
  }
  .launch-status .big-emoji {
    font-size: 56px;
    line-height: 1;
    margin-bottom: 14px;
  }
  .launch-status h2 {
    margin: 0 0 6px;
    font-size: 24px;
    color: var(--n-800);
  }
  .launch-status p {
    margin: 0;
    color: var(--n-700);
    font-size: 15px;
  }

  .copy-block {
    background: var(--n-800);
    color: var(--n-100);
    border-radius: 10px;
    padding: 18px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    position: relative;
    margin-top: 16px;
  }
  .copy-block pre { margin: 0; white-space: pre-wrap; }
  .copy-btn {
    position: absolute;
    top: 10px; right: 10px;
    padding: 4px 10px;
    font-size: 11.5px;
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .copy-btn:hover { background: rgba(255,255,255,0.2); }

  /* ---------- Lifecycle illustration ---------- */
  .lifecycle {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 8px 0;
  }
  .lc-stage {
    background: var(--n-100);
    border: 1px solid var(--n-200);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    position: relative;
    transition: all 0.2s;
  }
  .lc-stage.active {
    background: var(--u-100);
    border-color: var(--u-400);

  // ============================================================

  function storageKey() {
    const name = (document.getElementById('propName').value || '').trim() || 'default';

    return 'usd-wizard::' + name + '::' + state;
  }
  function getState() {
    try { return JSON.parse(localStorage.getItem(storageKey()) || '{}'); }
    catch(e) { return {}; }
  }
  function setState(s) {
    localStorage.setItem(storageKey(), JSON.stringify(s));
    flashSaved();
  }
  function mergeState(patch) {
    const s = getState();
    Object.assign(s, patch);
    setState(s);
  }
  let saveTimer = null;
  function flashSaved() {
    const el = document.getElementById('saveInd');
    el.classList.remove('saving');
    el.querySelector('span').textContent = 'Saved';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {}, 800);
  }

  // taskRow: a check item that captures structured data.
  // inputs = [{ key, label, type, placeholder, hint, options, cols }]
  //   type: 'text' | 'email' | 'date' | 'number' | 'tel' | 'select' | 'textarea' | 'toggle'
  //   options: [{value,label}] (for select)
  //   cols: 1|2|3 (default 1)
  //   span: 1|2|3 (how wide the field is in the grid)
  function taskRow(id, title, sub, inputs) {
    const state = getState();
    const checked = !!state[id];
    const cols = inputs && inputs.length > 1 ? (inputs.length >= 3 ? 'cols-3' : 'cols-2') : '';
    let inputsHTML = '';
    if (inputs && inputs.length) {
      inputsHTML = `<div class="task-inputs ${cols}">`;
      inputs.forEach(inp => {
        const val = state[inp.key];
        const safe = (val === undefined || val === null) ? '' : String(val).replace(/"/g, '&quot;');
        const spanCls = inp.span === 2 ? 'span-2' : (inp.span === 3 ? 'span-3' : '');
        if (inp.type === 'toggle') {
          inputsHTML += `
            <div class="task-input-field ${spanCls}">
              <label style="visibility:hidden;height:0;margin:0;">${inp.label}</label>
              <label class="toggle-pill">
                <input type="checkbox" data-cfg="${inp.key}" ${state[inp.key] ? 'checked' : ''}>
                <span class="toggle-box"></span>
                <span class="toggle-label">${inp.label}</span>
              </label>
            </div>`;
        } else if (inp.type === 'select') {
          const opts = (inp.options || []).map(o =>
            `<option value="${o.value}" ${safe===o.value?'selected':''}>${o.label}</option>`
          ).join('');
          inputsHTML += `
            <div class="task-input-field ${spanCls}">
              <label>${inp.label}</label>
              <select data-cfg="${inp.key}">
                <option value="">${inp.placeholder || 'Select…'}</option>
                ${opts}
              </select>
              ${inp.hint ? `<div class="field-hint ${inp.hintClass||''}">${inp.hint}</div>` : ''}
            </div>`;
        } else if (inp.type === 'textarea') {
          inputsHTML += `
            <div class="task-input-field span-3">
              <label>${inp.label}</label>
              <textarea data-cfg="${inp.key}" placeholder="${inp.placeholder||''}">${safe}</textarea>
              ${inp.hint ? `<div class="field-hint ${inp.hintClass||''}">${inp.hint}</div>` : ''}
            </div>`;
        } else {
          inputsHTML += `
            <div class="task-input-field ${spanCls}">
              <label>${inp.label}</label>
              <input type="${inp.type||'text'}" data-cfg="${inp.key}" value="${safe}" placeholder="${inp.placeholder||''}" />
              ${inp.hint ? `<div class="field-hint ${inp.hintClass||''}">${inp.hint}</div>` : ''}
            </div>`;
        }
      });
      inputsHTML += `</div>`;
    }
    return `
      <li class="task-row ${checked ? 'done' : ''}" data-mc="${id}">
        <div class="task-check" onclick="toggleMicro('${id}')" title="Mark done"></div>
        <div class="task-body">
          <div class="task-title" onclick="toggleMicro('${id}')">${title}</div>
          ${sub ? `<div class="task-sub">${sub}</div>` : ''}
          ${inputsHTML}
        </div>
      </li>
    `;
  }
  function toggleMicro(id) {
    const s = getState();
    if (s[id]) delete s[id]; else s[id] = true;
    setState(s);
    renderStep(currentStep);
    renderStepper();
    updateProgress();
  }
  function toggleWhy(btn) {
    const c = btn.nextElementSibling;
    c.classList.toggle('open');
    btn.textContent = c.classList.contains('open')
      ? btn.textContent.replace('▾', '▴')
      : btn.textContent.replace('▴', '▾');
  }
  function isAllDone() {
    return STEPS.every((s,i) => isStepDone(i));
  }

  // ============================================================
  // Step completion logic
  // ============================================================
  // A step is "done" when its `data-step-checks` items are all checked,
  // OR when it has been explicitly marked done by the user (markStepDone).
  const STEP_CHECK_KEYS = {
    1: ['req-1','req-2','req-3'],
    2: ['ap-1','ap-2','ap-3','ap-4','ap-5'],
    3: ['lg-1','lg-2','lg-3'],
    4: [], // no micro-checks; mark via continue
    5: ['ls-1','ls-2','ls-3','ls-4'],
    6: ['cl-1','cl-2','cl-3','cl-4'],
    7: ['tr-1','tr-2','tr-3'],
    8: ['act-1','act-2'],
    9: ['at-1','at-2'],
    10: ['vf-1','vf-2','vf-3','vf-4'],
    11: ['an-1','an-2','an-3','an-4'],
  };

  function isStepDone(stepIndex) {
    if (stepIndex === 0) return !!getState()['__welcomed'];
    const keys = STEP_CHECK_KEYS[stepIndex];
    if (!keys || keys.length === 0) {
      return !!getState()['__step' + stepIndex];
    }
    const s = getState();
    return keys.every(k => s[k]);
  }

  function markStepCompleteByContinue(stepIndex) {
    const s = getState();
    if (stepIndex === 0) s['__welcomed'] = true;
    else if (!STEP_CHECK_KEYS[stepIndex] || STEP_CHECK_KEYS[stepIndex].length === 0) {
      s['__step' + stepIndex] = true;
    }
    // For steps with checks, "Continue" advances even if not all checked — user discretion.
    setState(s);
  }

  // ============================================================
  // Render: stepper + active step
  // ============================================================
  let currentStep = 0;

  function renderStepper() {
    const el = document.getElementById('stepper');
    let html = '';
    let lastPhase = null;
    STEPS.forEach((s, i) => {
      if (s.phase !== lastPhase) {
        html += `<div class="stepper-group"><div class="stepper-label">${s.phase}</div>`;
        lastPhase = s.phase;
      }
      const done = isStepDone(i);
      const current = i === currentStep;
      html += `
        <div class="step-link ${current ? 'current' : ''} ${done ? 'done' : ''}" onclick="goToStep(${i})">
          <div class="step-dot"><span class="num">${i + 1}</span></div>
          <div>${s.title}</div>
        </div>
      `;
    });
    html += '</div>';
    el.innerHTML = html;
  }

  function renderStep(i) {
    const s = STEPS[i];
    const container = document.getElementById('stepContainer');
    container.innerHTML = `
      <div class="step-header">
        <div class="step-icon">${icon(s.icon)}</div>
        <div class="step-h">
          <div class="crumb">${s.phase} · Step ${i + 1}</div>
          <h1>${s.title}</h1>
          <div class="sub">${s.sub}</div>
        </div>
      </div>
      ${s.render()}
    `;
    // Bind cfg inputs (handles checkboxes + value inputs)
    container.querySelectorAll('[data-cfg]').forEach(input => {
      const k = input.dataset.cfg;
      const saved = getState()[k];
      if (input.type === 'checkbox') {
        input.checked = !!saved;
        input.addEventListener('change', () => {
          mergeState({ [k]: input.checked });
        });
      } else {
        if (saved !== undefined && saved !== '') input.value = saved;
        input.addEventListener('input', () => {
          mergeState({ [k]: input.value });
        });
      }
    });
    document.getElementById('curNum').textContent = i + 1;
    document.getElementById('totalNum').textContent = STEPS.length;
    document.getElementById('prevBtn').disabled = i === 0;
    document.getElementById('nextBtn').disabled = i === STEPS.length - 1;
    document.getElementById('nextBtn').innerHTML = (i === STEPS.length - 1)
      ? 'All done <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
      : 'Mark done & continue <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';
  }

  function updateProgress() {
    let done = 0;
    STEPS.forEach((_, i) => { if (isStepDone(i)) done++; });
    const pct = Math.round(done / STEPS.length * 100);
    document.getElementById('progressFill').style.width = pct + '%';
  }

  function goToStep(i) {
    if (i < 0 || i >= STEPS.length) return;
    currentStep = i;
    mergeState({ __currentStep: i });
    renderStepper();
    renderStep(i);
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('prevBtn').onclick = () => goToStep(currentStep - 1);
  document.getElementById('nextBtn').onclick = () => {
    markStepCompleteByContinue(currentStep);
    if (currentStep < STEPS.length - 1) goToStep(currentStep + 1);
    else { renderStepper(); renderStep(currentStep); updateProgress(); }
  };

  // ============================================================
  // Copy announcement
  // ============================================================
  function copyAnnouncement() {
    const text = document.getElementById('announceText').innerText;
    navigator.clipboard.writeText(text);
    const btn = event.target;
    const oldText = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => btn.textContent = oldText, 1400);
  }

  // ============================================================
  // Property strip bindings
  // ============================================================
  const propInputs = ['propName', 'propState', 'propPMS', 'propCustomer'];
  function loadPropertyStrip() {
    // Use a global "last property" pointer so the page restores last context
    const last = JSON.parse(localStorage.getItem('usd-wizard::last') || '{}');
    propInputs.forEach(id => {
      const el = document.getElementById(id);
      if (last[id] !== undefined) el.value = last[id];
    });
  }
  function savePropertyStrip() {
    const last = {};
    propInputs.forEach(id => last[id] = document.getElementById(id).value);
    localStorage.setItem('usd-wizard::last', JSON.stringify(last));
    flashSaved();
  }
  propInputs.forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      savePropertyStrip();
      // re-render to pick up state changes (refund window etc)
      renderStep(currentStep);
      renderStepper();
      updateProgress();
    });
  });

  // ============================================================
  // Boot
  // ============================================================
  loadPropertyStrip();
  const saved = getState();
  if (typeof saved.__currentStep === 'number') currentStep = saved.__currentStep;
  renderStepper();
  renderStep(currentStep);
  updateProgress();
</script>
</body>
</html>
